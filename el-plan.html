<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>El Plan</title>
<style>
:root{
  --bg:#0a0e0c;
  --surface:#141a16;
  --surface-2:#1c241f;
  --line:#28332c;
  --text:#e9f2ea;
  --muted:#8b9c91;
  --accent:#79e08a;
  --accent-soft:rgba(121,224,138,.13);
  --warn:#f5b544;
  --warn-soft:rgba(245,181,68,.13);
  --bad:#ff6b6b;
  --bad-soft:rgba(255,107,107,.13);
  --info:#5cc8e0;
  --info-soft:rgba(92,200,224,.12);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none}
input{font-family:inherit}

/* ---------- LAYOUT ---------- */
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
     padding-bottom:calc(96px + env(safe-area-inset-bottom))}

.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  background:rgba(10,14,12,.86);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.tb-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
.tb-date{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.tb-stats{display:flex;gap:8px}
.tb-stat{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  padding:6px 11px;text-align:center;min-width:66px;
}
.tb-stat b{display:block;font-size:15px;font-weight:800;line-height:1.1}
.tb-stat span{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em}

main{flex:1;padding:16px 18px 0}

/* ---------- TABBAR ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;
  background:rgba(10,14,12,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar-inner{display:flex;width:100%;max-width:520px}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:11px 0 10px;color:var(--muted);font-size:10px;font-weight:600;
  transition:color .15s;
}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
         stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s}
.tab.active{color:var(--accent)}
.tab:active{opacity:.6}

/* ---------- CARDS ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.section-head h2{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
                 color:var(--muted);margin:0}
.section-head button{font-size:13px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:10px}
.section-head button:active{background:var(--surface-2)}

/* ---------- VERDICT ---------- */
.verdict{
  display:flex;gap:13px;align-items:flex-start;
  padding:16px;border-radius:var(--r);border:1px solid;margin-bottom:14px;
}
.verdict.good{background:var(--accent-soft);border-color:rgba(121,224,138,.32)}
.verdict.warn{background:var(--warn-soft);border-color:rgba(245,181,68,.32)}
.verdict.bad{background:var(--bad-soft);border-color:rgba(255,107,107,.32)}
.v-dot{width:11px;height:11px;border-radius:50%;margin-top:6px;flex:none}
.good .v-dot{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.warn .v-dot{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.bad .v-dot{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.v-body{flex:1;min-width:0}
.v-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.v-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
.v-score{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.v-msg{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.v-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:11px;overflow:hidden}
.v-bar i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.good .v-bar i{background:var(--accent)}
.warn .v-bar i{background:var(--warn)}
.bad .v-bar i{background:var(--bad)}

/* ---------- RINGS ---------- */
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ringbox{
  display:flex;flex-direction:column;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 8px 14px;
}
.ringwrap{position:relative;width:116px;height:116px}
.ring{width:116px;height:116px;display:block}
.ringbg{fill:none;stroke:var(--surface-2);stroke-width:11}
.ringfg{fill:none;stroke-width:11;stroke-linecap:round;
        transform:rotate(-90deg);transform-origin:60px 60px;
        transition:stroke-dashoffset .55s cubic-bezier(.2,.8,.2,1)}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;
          align-items:center;justify-content:center;line-height:1.1;pointer-events:none}
.ringtext b{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ringtext span{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}
.ringcap{margin-top:9px;font-size:12.5px;color:var(--muted);font-weight:700;
         letter-spacing:.05em;text-transform:uppercase}

/* ---------- MINI STATS ---------- */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px}
.stat .lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-size:17px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .val small{font-size:10px;font-weight:600;color:var(--muted);margin-left:3px}

/* ---------- FIBER BAR ---------- */
.fibercard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
           padding:14px 16px;margin-bottom:12px}
.fibercard .top{display:flex;align-items:baseline;justify-content:space-between}
.fibercard .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fibercard .num{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.fibercard .num small{font-size:11px;color:var(--muted);font-weight:600}
.fbar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:9px;overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#a3e635);border-radius:3px;
        transition:width .45s cubic-bezier(.2,.8,.2,1)}
.fibercard .hint{font-size:11.5px;color:var(--muted);margin-top:8px}

/* ---------- DR PEPPER ---------- */
.dp-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dp-row .grow{flex:1;min-width:0}
.dp-bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.dp-bar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#c084fc);
          border-radius:3px;transition:width .4s}
.dp-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
        padding:9px 13px;font-size:13px;font-weight:700;flex:none}
.dp-btn:active{background:#26302a}

/* ---------- LOG ---------- */
.loglist{display:flex;flex-direction:column;gap:9px}
.logitem{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:12px 12px 12px 15px;
}
.logmain{flex:1;min-width:0}
.logname{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logmeta{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);
         border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.stepper button{width:32px;height:32px;border-radius:9px;font-size:18px;font-weight:600;
                display:flex;align-items:center;justify-content:center;color:var(--muted)}
.stepper button:active{background:#2b362f;color:var(--text)}
.stepper b{min-width:22px;text-align:center;font-size:14px;font-weight:800;
           font-variant-numeric:tabular-nums}

.empty{
  text-align:center;padding:34px 20px;color:var(--muted);font-size:14px;
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);
}
.empty span{font-size:12.5px;opacity:.7}

/* ---------- FOODS ---------- */
.searchrow{margin-bottom:12px}
.search{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;color:var(--text);font-size:16px;outline:none;
}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin:0 -18px;padding-left:18px;
       padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#08150c}
.chip:active{opacity:.7}

.foodlist{display:flex;flex-direction:column;gap:9px}
.foodrow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px 13px 16px;transition:background .12s;
}
.foodrow:active{background:var(--surface-2)}
.foodinfo{flex:1;min-width:0}
.foodname{font-size:14.5px;font-weight:700;line-height:1.25}
.foodserv{font-size:12px;color:var(--muted);margin-top:2px}
.foodmacros{text-align:right;flex:none}
.foodmacros b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.foodmacros span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;
                 font-variant-numeric:tabular-nums}
.plus{
  flex:none;width:34px;height:34px;border-radius:11px;background:var(--accent-soft);
  color:var(--accent);font-size:19px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.custombtn{
  width:100%;margin-top:14px;padding:15px;border-radius:16px;
  border:1px dashed var(--line);color:var(--muted);font-size:14.5px;font-weight:700;
  background:transparent;
}
.custombtn:active{background:var(--surface)}

/* ---------- MICROS ---------- */
.micro{
  display:flex;gap:13px;align-items:flex-start;padding:15px 16px;margin-bottom:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  transition:border-color .15s,background .15s;
}
.micro.on{border-color:rgba(121,224,138,.35);background:var(--accent-soft)}
.micro-check{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
  color:#08150c;margin-top:1px;transition:.15s;
}
.micro.on .micro-check{background:var(--accent);border-color:var(--accent)}
.micro-body{flex:1;min-width:0}
.micro-name{font-size:14.5px;font-weight:700;display:flex;align-items:center;
            gap:7px;flex-wrap:wrap}
.micro-desc{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.badge{
  font-size:9.5px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;
  background:var(--accent);color:#08150c;
}

/* ---------- PLAN ---------- */
.plan-row{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.plan-row:last-child{border-bottom:0;padding-bottom:0}
.plan-row:first-child{padding-top:0}
.plan-day{
  flex:none;width:48px;font-size:11px;font-weight:800;letter-spacing:.05em;
  color:var(--accent);text-transform:uppercase;padding-top:2px;
}
.plan-txt{flex:1;min-width:0}
.plan-txt b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.plan-txt span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block;margin-top:3px}
.rest{color:var(--warn)!important}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- DIET PLANS ---------- */
.planblock{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:14px;overflow:hidden;
}
.planblock .head{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.planblock .head h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.planblock .head .tag{font-size:12.5px;color:var(--muted);line-height:1.4}
.planblock .totals{display:flex;gap:14px;padding:12px 16px;background:var(--surface-2);
                   border-bottom:1px solid var(--line);font-size:13px}
.planblock .totals div{flex:1}
.planblock .totals .lbl{font-size:10px;color:var(--muted);font-weight:700;
                        letter-spacing:.05em;text-transform:uppercase}
.planblock .totals .val{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.planblock .combocount{padding:12px 16px;background:var(--surface-2);
                       border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.planblock .combocount b{color:var(--text);font-weight:800;font-size:15px}
.mealrow{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);width:100%;text-align:left;
}
.mealrow:last-child{border-bottom:0}
.mealrow:active{background:var(--surface-2)}
.mealrow .label{flex:none;width:72px;font-size:11px;font-weight:800;
                letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.mealrow .desc{flex:1;min-width:0;font-size:13px;line-height:1.35}
.mealrow .macros{flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
.mealrow .macros b{display:block;font-weight:800;font-size:13.5px}
.mealrow .macros span{color:var(--muted);font-size:11px}
.planblock .note{
  padding:12px 16px;font-size:12.5px;line-height:1.45;
  border-top:1px solid var(--line);background:var(--warn-soft);color:var(--text);
}
.planblock .note.good{background:var(--accent-soft)}
.planblock .note.info{background:var(--info-soft);border-top-color:rgba(92,200,224,.32)}
.planblock .note b{font-weight:800}

/* ---------- COOK ---------- */
.cooksec{margin-bottom:22px}
.cooksec h3{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
            color:var(--muted);margin:0 2px 10px}
.cookitem{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:10px;
}
.cookitem .title{font-size:15px;font-weight:800;letter-spacing:-.01em}
.cookitem .shortcut{
  margin-top:9px;font-size:12.5px;line-height:1.45;color:var(--accent);
  background:var(--accent-soft);border-radius:10px;padding:9px 11px;
}
.cookitem .method{margin-top:10px;font-size:12.5px;color:var(--text)}
.cookitem .method .mlbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;
                         text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.cookitem .method ol{margin:0;padding-left:20px}
.cookitem .method ol li{margin-bottom:2px;line-height:1.4}
.cookitem .kettle{
  margin-top:8px;font-size:12px;color:var(--muted);font-style:italic;
}

/* ---------- DOCS HUB ---------- */
.doc-link-card{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:10px;text-decoration:none;color:var(--text);
  transition:border-color .15s, background .15s;
}
.doc-link-card:active{background:var(--surface-2);border-color:var(--accent)}
.doc-info h3{margin:0 0 3px;font-size:15px;font-weight:800}
.doc-info p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.doc-arrow{font-size:18px;color:var(--accent);font-weight:700;flex:none;margin-left:12px}
.doc-hint{font-size:12px;color:var(--muted);line-height:1.45;padding:0 2px 12px}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;
  transform:translateX(-50%) translateY(16px);
  background:#22302a;border:1px solid var(--line);color:var(--text);
  padding:13px 20px;border-radius:15px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.8,.2,1);
  max-width:92vw;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- SHEET ---------- */
.sheet-backdrop{
  position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .22s;
}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  width:100%;max-width:520px;background:var(--surface);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:22px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:90dvh;overflow-y:auto;
}
.sheet-backdrop.show .sheet{transform:translateY(0)}
.sheet h3{margin:0 0 16px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;
             text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;color:var(--text);font-size:16px;outline:none;
}
.field input:focus{border-color:var(--accent)}
.tag-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.tag-opt{padding:8px 13px;border-radius:11px;background:var(--surface-2);
         border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.tag-opt.on{background:var(--accent);border-color:var(--accent);color:#08150c}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;padding:15px;border-radius:15px;font-size:15px;font-weight:800;text-align:center;
}
.btn-primary{background:var(--accent);color:#08150c}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.btn:active{opacity:.75}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div>
      <div class="tb-title">El Plan</div>
      <div class="tb-date" id="tbDate">—</div>
    </div>
    <div class="tb-stats">
      <div class="tb-stat"><b id="hKcal">0</b><span>KCAL</span></div>
      <div class="tb-stat"><b id="hProt">0</b><span>G PROTEIN</span></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24"><path d="M3.5 6h17M3.5 12h17M3.5 18h11"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="foods">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
      <span>Foods</span>

/* =================== STATE =================== */
const KEY = 'elplan.v1';

function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function round1(x){ return Math.round(x*10)/10; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let state;
function loadState(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if(!s) s = { date: todayKey(), items: [], micros: {}, dp: 0, customFoods: [] };
  if(!Array.isArray(s.customFoods)) s.customFoods = [];
  if(!Array.isArray(s.items)) s.items = [];
  if(typeof s.dp !== 'number') s.dp = 0;
  if(!s.micros) s.micros = {};
  if(s.date !== todayKey()){ s.date = todayKey(); s.items = []; s.micros = {}; s.dp = 0; }
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* =================== HELPERS =================== */
function allFoods(){ return FOODS.concat(state.customFoods); }

function totals(){
  let k = 0, p = 0, f = 0;
  state.items.forEach(it => {
    k += it.kcal * it.qty;
    p += it.p * it.qty;
    f += (it.f || 0) * it.qty;
  });
  return { kcal: Math.round(k), p: Math.round(p*10)/10, f: Math.round(f*10)/10 };
}

function autoMicros(){
  const set = new Set();
  state.items.forEach(it => (it.tags || []).forEach(t => set.add(t)));
  if(set.has('iron') && set.has('vitc')) set.add('ironc');
  return set;
}

function microsDoneCount(){
  const auto = autoMicros();
  return MICROS.filter(m => state.micros[m.id] || auto.has(m.id)).length;
}

function score(t, mDone){
  const pS = Math.min(t.p / TARGET.protein, 1) * 50;
  let cS;
  if(t.kcal <= TARGET.kcalMax) cS = Math.min(t.kcal / TARGET.kcalMin, 1) * 27;
  else cS = Math.max(0, 27 - (t.kcal - TARGET.kcalMax) * 0.15);
  const fS = Math.min(t.f / TARGET.fiberMin, 1) * 10;
  const mS = (mDone / MICROS.length) * 13;
  return Math.round(Math.min(100, pS + cS + fS + mS));
}

function verdict(t){
  const over  = t.kcal > TARGET.kcalMax;
  const under = t.kcal < TARGET.kcalMin;
  const pOk   = t.p >= TARGET.protein;
  const fOk   = t.f >= TARGET.fiberMin;

  if(over) return {
    cls:'bad', title:'Over ceiling',
    msg: `${t.kcal - TARGET.kcalMax} kcal past the 2,200 ceiling. Switch to protein-only or stop eating for the day.`
  };
  if(pOk && !under && fOk) return {
    cls:'good', title:'Optimal',
    msg: 'Calories, protein and fibre all in range. Hold this line — nothing else needed.'
  };
  if(pOk && !under && !fOk) return {
    cls:'warn', title:'Fibre short',
    msg: `${round1(TARGET.fiberMin - t.f)} g fibre left. Add raspberries, chia, lentils or a handful of spinach.`
  };
  if(!pOk && !under) return {
    cls:'warn', title:'Protein short',
    msg: `${round1(TARGET.protein - t.p)} g protein left, with ${TARGET.kcalMax - t.kcal} kcal of room. Prioritise a shake.`
  };
  if(!pOk && under) return {
    cls:'warn', title:'Building',
    msg: `${TARGET.kcalMin - t.kcal}–${TARGET.kcalMax - t.kcal} kcal, ${round1(TARGET.protein - t.p)} g protein and ${Math.max(0, round1(TARGET.fiberMin - t.f))} g fibre still to go.`
  };
  return {
    cls:'good', title:'Protein hit',
    msg: `${TARGET.kcalMin - t.kcal}–${TARGET.kcalMax - t.kcal} kcal left to fill. Keep it clean.`
  };
}

  `;

  inp.addEventListener('input', e => { searchQ = e.target.value; updateFoodList(); });

function updateFoodList(){
  const el = document.getElementById('foodList');
  if(!el) return;
  const t = totals();
  const kLeft = Math.max(0, TARGET.kcalMax - t.kcal);
  const q = searchQ.trim().toLowerCase();

  const list = allFoods().filter(f => {
    if(activeCat !== 'All' && f.c !== activeCat) return false;
    if(q && !f.n.toLowerCase().includes(q)) return false;
    if(fitsOnly && f.k > kLeft) return false;
    return true;
  });

  if(!list.length){
    el.innerHTML = `<div class="empty">No matches.<br><span>Try another search or turn off the filter.</span></div>`;
    return;
  }

  el.innerHTML = list.map(f => `
    <button class="foodrow" data-action="add" data-id="${f.id}">
      <div class="foodinfo">
        <div class="foodname">${esc(f.n)}</div>
        <div class="foodserv">${esc(f.s)}${f.custom ? ' · custom' : ''}</div>
      </div>
      <div class="foodmacros"><b>${f.k}</b><span>${round1(f.p)} g P · ${round1(f.f||0)} g fib</span></div>
      <div class="plus">＋</div>
    </button>`).join('');
}

/* =================== HEADER / TABBAR =================== */
function refreshHeader(){
  const t = totals();
  document.getElementById('hKcal').textContent = t.kcal;
  document.getElementById('hProt').textContent = round1(t.p);
  const d = new Date();
  document.getElementById('tbDate').textContent =
    d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}

function updateTabbar(){
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === activeTab);
  });
}

function render(){
  if(activeTab === 'today') renderToday();
  else if(activeTab === 'foods') renderFoods();
  else if(activeTab === 'diets') renderDiets();
  else if(activeTab === 'cook') renderCook();
  else if(activeTab === 'micros') renderMicros();
  else if(activeTab === 'plan') renderPlan();
  else if(activeTab === 'docs') renderDocs();
  refreshHeader();
  updateTabbar();
}

/* =================== ACTIONS =================== */
function addFood(foodId){
  const f = allFoods().find(x => x.id === foodId);
  if(!f) return;

  const existing = state.items.find(i => i.foodId === foodId);
  if(existing) existing.qty += 1;
  else state.items.push({
    uid: uid(), foodId, name: f.n, kcal: f.k, p: f.p, f: f.f || 0,
    tags: f.t || [], qty: 1, time: nowTime()
  });

  save();
  render();

  const t = totals();
  const kLeft = Math.max(0, TARGET.kcalMax - t.kcal);
  const pLeft = Math.max(0, TARGET.protein - t.p);
  if(t.kcal > TARGET.kcalMax){
    toast(`⚠ ${f.n} added · ${t.kcal - TARGET.kcalMax} kcal OVER ceiling`);
  } else if(pLeft <= 0){
    toast(`✓ ${f.n} added · protein hit, ${kLeft} kcal left`);
  } else {
    toast(`✓ ${f.n} added · ${kLeft} kcal & ${round1(pLeft)} g protein left`);
  }
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* =================== CUSTOM FOOD SHEET =================== */
let customTags = new Set();

function openCustom(){
  customTags = new Set();
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <h3>Create custom food</h3>
    <div class="field">
      <label>Name</label>
      <input id="cfName" type="text" placeholder="e.g. Lidl Falafel" autocomplete="off">
    </div>
    <div class="field">
      <label>Serving</label>
      <input id="cfServ" type="text" placeholder="e.g. 100 g / 1 pack" value="1 serving" autocomplete="off">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div class="field">
        <label>Kcal</label>
        <input id="cfKcal" type="number" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label>Protein</label>
        <input id="cfProt" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <label>Fibre</label>
        <input id="cfFib" type="number" inputmode="decimal" placeholder="0">
      </div>
    </div>
    <div class="field">
      <label>Micronutrient tags</label>
      <div class="tag-grid" id="cfTags">
        ${TAG_OPTIONS.map(([id,label]) =>
          `<button class="tag-opt" data-tag="${id}">${label}</button>`).join('')}
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" data-action="closeSheet">Cancel</button>
      <button class="btn btn-primary" data-action="saveCustom">Save food</button>
    </div>
  `;
  document.getElementById('sheetBackdrop').classList.add('show');
}

function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('show');
}

function saveCustom(){
  const name = document.getElementById('cfName').value.trim();
  const serv = document.getElementById('cfServ').value.trim() || '1 serving';
  const kcal = parseFloat(document.getElementById('cfKcal').value) || 0;
  const prot = parseFloat(document.getElementById('cfProt').value) || 0;
  const fib  = parseFloat(document.getElementById('cfFib').value) || 0;

  if(!name){ toast('Give it a name first'); return; }

  state.customFoods.push({
    id: 'custom_' + uid(),
    n: name, s: serv, k: Math.round(kcal), p: round1(prot), f: round1(fib),
    t: Array.from(customTags), c: 'Extras', custom: true
  });
  save();
  closeSheet();
  render();
  toast(`✓ ${name} saved to your foods`);
}

/* =================== EVENT DELEGATION =================== */
document.addEventListener('click', e => {

  // Tab switching
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){
    activeTab = tabBtn.dataset.tab;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }

  // Category chips
  const chip = e.target.closest('[data-cat]');
  if(chip){
    activeCat = chip.dataset.cat;
    document.querySelectorAll('#chips .chip[data-cat]').forEach(c =>
      c.classList.toggle('on', c.dataset.cat === activeCat));
    updateFoodList();
    return;
  }

  // Tag chips inside sheet
  const tag = e.target.closest('[data-tag]');
  if(tag){
    const id = tag.dataset.tag;
    if(customTags.has(id)) customTags.delete(id); else customTags.add(id);
    tag.classList.toggle('on', customTags.has(id));
    return;
  }

  // Action buttons
  const act = e.target.closest('[data-action]');
  if(!act) return;
  const a = act.dataset.action;

  if(a === 'add'){ addFood(act.dataset.id); return; }

  if(a === 'logDietMeal'){
    const planId = act.dataset.plan;
    const idx = parseInt(act.dataset.idx);
    const plan = DIET_PLANS.find(p => p.id === planId);
    const m = plan.meals[idx];
    const existing = state.items.find(i => i.name === m.desc);
    if(existing) existing.qty += 1;
    else state.items.push({
      uid: uid(), foodId: 'diet_' + planId + '_' + idx, name: m.desc,
      kcal: m.k, p: m.p, f: m.f || 0, tags: [], qty: 1, time: nowTime()
    });
    save(); render();
    toast(`✓ ${m.desc} added`);
    return;
  }

  if(a === 'inc' || a === 'dec'){
    const it = state.items.find(i => i.uid === act.dataset.uid);
    if(!it) return;
    if(a === 'inc') it.qty += 1;
    else {
      it.qty -= 1;
      if(it.qty <= 0){
        state.items = state.items.filter(i => i.uid !== it.uid);
        toast(`Removed ${it.name}`);
      }
    }
    save(); render(); return;
  }

  if(a === 'clearLog'){
    state.items = [];
    save(); render(); toast('Log cleared'); return;
  }

  if(a === 'dpAdd'){
    state.dp += 330;
    save(); render();
    if(state.dp > TARGET.dpMax) toast('⚠ Over your 2 L Dr Pepper Zero cap');
    return;
  }
  if(a === 'dpReset'){ state.dp = 0; save(); render(); return; }

  if(a === 'toggleMicro'){
    const id = act.dataset.id;
    const auto = autoMicros();
    if(auto.has(id)){ toast('Already covered by your food log'); return; }
    state.micros[id] = !state.micros[id];
    save(); render();
    const m = MICROS.find(x => x.id === id);
    if(state.micros[id]) toast(`✓ ${m.n} logged`);
    return;
  }

  if(a === 'fits'){
    fitsOnly = !fitsOnly;
    act.classList.toggle('on', fitsOnly);
    updateFoodList();
    return;
  }

  if(a === 'openCustom'){ openCustom(); return; }
  if(a === 'closeSheet'){ closeSheet(); return; }
  if(a === 'saveCustom'){ saveCustom(); return; }

  if(a === 'resetDay'){
    state.items = []; state.micros = {}; state.dp = 0;
    save(); render(); toast('Day reset'); return;
  }
});

document.getElementById('sheetBackdrop').addEventListener('click', e => {
  if(e.target.id === 'sheetBackdrop') closeSheet();
});

/* =================== DATE ROLLOVER =================== */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    if(state.date !== todayKey()){
      state = loadState();
      save();
      render();
      toast('New day — log reset');
    }
  }
});

/* =================== BOOT =================== */
render();
</script>
